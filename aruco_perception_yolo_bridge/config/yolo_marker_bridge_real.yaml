# Real robot topics (D415 over Zenoh -- see CLAUDE.md's Real Robot Camera
# Setup section and aruco_perception/config/aruco_detector_real.yaml,
# which this mirrors). pose_topic is intentionally identical to the
# classical detector's -- this node is meant to be a drop-in swap, never a
# parallel publisher. detections_2d_topic (cup_holder/hole, requested by
# depth-perception) has no classical-detector equivalent to mirror -- it's
# new with this node.
yolo_marker_bridge_node:
  ros__parameters:
    image_topic: "/D415/color/image_raw"
    camera_info_topic: "/D415/color/camera_info"
    pose_topic: "/aruco_perception/marker_pose"
    detections_2d_topic: "/aruco_perception/detections_2d"

    # classical/hybrid switch: false = classical aruco_detector_node is the
    # active marker-pose publisher on startup. Only gates the aruco_marker
    # publish -- cup_holder/hole detections_2d always publish regardless.
    # Flipped live by calibration_orchestrator_node via set_parameters, no
    # restart needed — see yolo_marker_bridge_node.py's class doc comment.
    active: false

    # Assumes the YOLO inference server (YOLO-pipeline/inference_server.py)
    # is running inside ~/yolo_venv on the same rosject machine as this
    # node. Per the locked HTTP-server architecture, this is
    # localhost-only, never a remote URL.
    # Moved 8600 -> 8601 (2026-07-28) -- see sim's own comment for the
    # full reason (a stale, never-killed old inference_server.py process
    # silently squatting on 8600). Must match YOLO-pipeline/config/
    # server_real.yaml's own port.
    inference_server_url: "http://127.0.0.1:8601/detect"
    # Bumped 1.0 -> 3.0 (2026-07-24, live real testing) — 1.0s was too
    # tight for JPEG-encode + HTTP round-trip + a full YOLO forward pass
    # on this rosject's hardware, hit on essentially every frame
    # ("Read timed out (read timeout=1.0)"). Bumped 3.0 -> 8.0 (2026-07-26,
    # rosbag-playback test) — still timing out at 3.0s even with
    # inference_server.py confirmed healthy (model_loaded:true); suspected
    # first-request model cold-start cost. PLACEHOLDER — may still need
    # further tuning once actual per-frame inference latency is measured
    # directly on this machine.
    # request_timeout_sec: 3.0
    request_timeout_sec: 8.0
    confidence_threshold: 0.25
    jpeg_quality: 90

    # Downscale before sending to inference_server.py (2026-07-28) — CPU-
    # only env, no GPU; smaller image = less YOLO compute per request.
    # Native width here is 424 (D415), so this is a smaller reduction than
    # sim's 640->320, but kept the same target value as sim per explicit
    # choice (consistent behavior across environments).
    # possible values: 0 (disabled, native 424 resolution), 160, 240, 320,
    # or any other positive integer up to 424.
    detect_max_width_px: 320

    # Overlay -- same param names/defaults as aruco_detector_real.yaml's
    # classical overlay, so /aruco_perception/overlay_image looks identical
    # regardless of which detector produced it.
    publish_overlay_image: true
    overlay_image_topic: "/aruco_perception/overlay_image"
    overlay_border_color_bgr: [0, 255, 255]
    marker_length_m: 0.045

    # Marker-cascade throttling (2026-07-27) -- see
    # yolo_marker_bridge_node.py's __init__ comment for the full
    # rationale (inference_server.py's marker cascade found costing
    # 0.17-0.36s/request live, even with no marker present, starving
    # cup_holder/hole of a smoother detection stream). 10 = only 1 in 10
    # camera frames actually attempts marker detection; set to 1 to
    # restore the original always-check-every-frame behavior.
    marker_check_every_n_frames: 10
    # Always force full-rate marker checking whenever "active" (above) is
    # true, regardless of marker_check_every_n_frames -- calibration/
    # auto-centering must never be starved by this throttle. Keep this
    # true; only set false for isolated testing of the throttle itself.
    marker_check_full_rate_when_active: false

    # depth_perception_node's continuous "held position" stream (2026-07-27)
    # — subscribed here purely to draw a stabilized dot/label on THIS
    # node's own overlay image, alongside its raw per-frame YOLO boxes.
    # See yolo_marker_bridge_node.py's module doc comment and
    # StablePositionArray.msg for the full rationale. Must match
    # depth_perception_{sim,real}.yaml's own stable_positions_topic.
    stable_positions_topic: "/depth_perception/stable_positions"

    # "Extras" overlay toggle (2026-07-28) — default OFF: only the plain
    # green raw-YOLO centroid/box is drawn. Set true (live, no restart —
    # `ros2 param set /yolo_marker_bridge_node show_extras_markers true`)
    # to also draw depth_perception's magenta (held)/cyan (just drifted)
    # stable-position markers on the SAME overlay topic — no new topic
    # needed, this only gates drawing of data already flowing on
    # stable_positions_topic above.
    show_extras_markers: false

    # Calibration/self-centering suppression (2026-07-28) — while an
    # ~/auto_calibrate run is in progress (including its auto-centering
    # stage), ALL overlay markers (green + extras) are suppressed, not
    # just extras — confirmed live that a held/stable marker was
    # indistinguishable from a fresh detection while the arm physically
    # blocked the camera mid-calibration. Must match
    # calibration_orchestrator_{sim,real}.yaml's own
    # auto_calibrate_status_pub_ topic (same one depth_perception_node
    # already subscribes to for its own pause behavior).
    auto_calibrate_status_topic: "/calibration_orchestrator_node/auto_calibrate_status"