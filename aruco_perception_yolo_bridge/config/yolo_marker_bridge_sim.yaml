# Simulation topics (see CLAUDE.md's Key Topics section and
# aruco_perception/config/aruco_detector_sim.yaml, which this mirrors).
# pose_topic is intentionally identical to the classical detector's --
# this node is meant to be a drop-in swap, never a parallel publisher.
# detections_2d_topic (cup_holder/hole, requested by depth-perception) has
# no classical-detector equivalent to mirror -- it's new with this node.
yolo_marker_bridge_node:
  ros__parameters:
    image_topic: "/wrist_rgbd_depth_sensor/image_raw"
    camera_info_topic: "/wrist_rgbd_depth_sensor/camera_info"
    pose_topic: "/aruco_perception/marker_pose"
    detections_2d_topic: "/aruco_perception/detections_2d"

    # classical/hybrid switch: false = classical aruco_detector_node is the
    # active marker-pose publisher on startup. Only gates the aruco_marker
    # publish -- cup_holder/hole detections_2d always publish regardless.
    # Flipped live by calibration_orchestrator_node via set_parameters, no
    # restart needed — see yolo_marker_bridge_node.py's class doc comment.
    active: false

    # Assumes the YOLO inference server (YOLO-pipeline/inference_server.py)
    # is running on the same machine as this node -- true today for both
    # the local dev box and the rosject's ~/yolo_venv setup. Per the
    # locked HTTP-server architecture, this is localhost-only, never a
    # remote URL.
    # Moved 8600 -> 8601 (2026-07-28) -- a stale, never-killed old
    # inference_server.py silently squatted on 8600, so a fresh server
    # start failed to bind ("Address already in use") without fully
    # exiting, leaving every /detect request served by outdated code
    # regardless of what was fixed on the ROS side. Must match
    # YOLO-pipeline/config/server_sim.yaml's own port.
    inference_server_url: "http://127.0.0.1:8601/detect"
    # Bumped 1.0 -> 8.0 -> 30.0 (2026-07-28) -- 8.0s was found live to be
    # the ACTUAL bug, not just a slow-but-tolerable value: inference_server.py's
    # Flask dev server is single-threaded and CANNOT be told to cancel a
    # request that's already running once the client gives up on it. So
    # once the client abandoned a request at 8s, the SERVER kept computing
    # it anyway in the background -- and the very next camera frame then
    # started a SECOND request while the first was still genuinely
    # running, oversubscribing the CPU (torch/YOLO's own internal thread
    # pool competing against itself across overlapping requests) and
    # cascading into progressively worse times (confirmed live: single
    # detect_centroids() calls measured at 6-12+ seconds, an order of
    # magnitude worse than early/isolated requests). 30.0s is comfortably
    # above every observed single-request time in that same log (worst
    # seen: ~20s total), so the client should now never abandon a request
    # the server is still legitimately working on -- this alone should
    # stop the pile-up, since self._request_in_flight (see image_callback)
    # already prevents a NEW request from starting while THIS ONE is still
    # being awaited; it just couldn't help once the client gave up early.
    request_timeout_sec: 30.0
    confidence_threshold: 0.25
    jpeg_quality: 90

    # hole_number flicker fix (2026-07-30) -- see
    # yolo_marker_bridge_node.py's assign_hole_quadrants doc comment for
    # the full mechanism/rationale. Deadband (pixels, full native-resolution
    # image space -- same space cx/cy/bbox already publish in) added around
    # the top/bottom and left/right reference lines used to quadrant-label
    # each "hole" detection: a hole only flips to the other side of a line
    # once it crosses by MORE than this many pixels, not the instant it
    # crosses zero -- stops ordinary per-frame detection noise from
    # flickering a boundary-straddling hole's hole_number between two
    # different values every frame (which corrupts
    # depth_perception_node's rolling_windows_ keyed by (class_name,
    # hole_number) -- see that fix's own doc comment for the full
    # downstream failure mode). 6px chosen as roughly 1.5x
    # cup_holder_detector_sim.yaml's hole_min_radius_px (4px) -- the only
    # existing pixel-scale reference for "how big is a hole" in this
    # codebase, and a reasonable floor for "this is a genuinely new
    # position, not noise." Live-tunable (`ros2 param set
    # /yolo_marker_bridge_node hole_quadrant_hysteresis_px <value>`) --
    # increase if hole_number is still observed to flicker live, decrease
    # if a genuinely moving hole is observed to lag/stick past where it
    # should have relabeled.
    hole_quadrant_hysteresis_px: 6.0

    # Downscale before sending to inference_server.py (2026-07-28) — CPU-
    # only env, no GPU; smaller image = less YOLO compute per request.
    # possible values: 0 (disabled, native 640 resolution), 160, 240, 320,
    # 480, or any other positive integer up to 640.
    detect_max_width_px: 320

    # Overlay -- same param names/defaults as aruco_detector_sim.yaml's
    # classical overlay, so /aruco_perception/overlay_image looks identical
    # regardless of which detector produced it.
    publish_overlay_image: true
    overlay_image_topic: "/aruco_perception/overlay_image"
    overlay_border_color_bgr: [0, 255, 255]
    marker_length_m: 0.045

    # Marker-cascade throttling (2026-07-27) -- see
    # yolo_marker_bridge_node.py's __init__ comment for the full
    # rationale (inference_server.py's marker cascade found costing
    # 0.17-0.36s/request live, even with no marker present, starving
    # cup_holder/hole of a smoother detection stream). 10 = only 1 in 10
    # camera frames actually attempts marker detection; set to 1 to
    # restore the original always-check-every-frame behavior.
    marker_check_every_n_frames: 10
    # Always force full-rate marker checking whenever "active" (above) is
    # true, regardless of marker_check_every_n_frames -- calibration/
    # auto-centering must never be starved by this throttle. Keep this
    # true; only set false for isolated testing of the throttle itself.
    marker_check_full_rate_when_active: false

    # depth_perception_node's continuous "held position" stream (2026-07-27)
    # — subscribed here purely to draw a stabilized dot/label on THIS
    # node's own overlay image, alongside its raw per-frame YOLO boxes.
    # See yolo_marker_bridge_node.py's module doc comment and
    # StablePositionArray.msg for the full rationale. Must match
    # depth_perception_{sim,real}.yaml's own stable_positions_topic.
    stable_positions_topic: "/depth_perception/stable_positions"

    # "Extras" overlay toggle (2026-07-28) — default OFF: only the plain
    # green raw-YOLO centroid/box is drawn. Set true (live, no restart —
    # `ros2 param set /yolo_marker_bridge_node show_extras_markers true`)
    # to also draw depth_perception's magenta (held)/cyan (just drifted)
    # stable-position markers on the SAME overlay topic — no new topic
    # needed, this only gates drawing of data already flowing on
    # stable_positions_topic above.
    show_extras_markers: false

    # Calibration/self-centering suppression (2026-07-28) — while an
    # ~/auto_calibrate run is in progress (including its auto-centering
    # stage), ALL overlay markers (green + extras) are suppressed, not
    # just extras — confirmed live that a held/stable marker was
    # indistinguishable from a fresh detection while the arm physically
    # blocked the camera mid-calibration. Must match
    # calibration_orchestrator_{sim,real}.yaml's own
    # auto_calibrate_status_pub_ topic (same one depth_perception_node
    # already subscribes to for its own pause behavior).
    auto_calibrate_status_topic: "/calibration_orchestrator_node/auto_calibrate_status"