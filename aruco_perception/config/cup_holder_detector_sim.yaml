# Simulation-only classical CV cup_holder/hole detector. No _real.yaml
# counterpart exists — this node is never launched on real (see
# cup_holder_detector_node.hpp's class doc comment). All thresholds below
# are a first-pass estimate from the reference cup_holder image (bright
# white/grey disc, ~4 dark reddish holes) — expect to retune live via
# `ros2 param set /cup_holder_detector_node <name> <value>` against the
# actual running sim feed (viewcam alias / rqt_image_view on
# /wrist_rgbd_depth_sensor/image_raw, or this node's own overlay_image_topic
# once publish_overlay_image is turned on).
cup_holder_detector_node:
  ros__parameters:
    image_topic: "/wrist_rgbd_depth_sensor/image_raw"

    # Same topic aruco_detector_node/yolo_marker_bridge_node already
    # publish Detection2DArray on — see class doc comment.
    detections_2d_topic: "/aruco_perception/detections_2d"

    # Overlay unification (2026-07-29): this node subscribes to
    # aruco_detector_node's marker-only overlay (aruco_detector_sim.yaml's
    # overlay_image_topic is rerouted to this exact name), draws cup_holder/
    # hole circles on top, and republishes the COMBINED image as the SOLE
    # publisher of overlay_image_topic below — the actual web-app-facing
    # /aruco_perception/overlay_image (see CupHolderDetectorNode's class doc
    # comment and CameraFeed.tsx's OVERLAY_IMAGE_TOPIC). Both topic names
    # must stay in sync with aruco_detector_sim.yaml's own
    # overlay_image_topic value — if that ever changes, update
    # overlay_image_input_topic here to match.
    publish_overlay_image: true
    overlay_image_input_topic: "/aruco_perception/overlay_image_marker_only"
    overlay_image_topic: "/aruco_perception/overlay_image"

    active: true

    # Pass 1 — cup_holder disc, found via its RIM (Canny edge + dilate +
    # findContours), NOT flat brightness. 2026-07-30: live-tested that the
    # disc has almost no brightness separation from the background wall in
    # sim's actual lighting — cv::threshold could never isolate it at any
    # cutoff — but Canny cleanly finds the rim as a closed loop (confirmed
    # via cup_holder_pipeline_debug.py against a live sim frame:
    # canny_low=80/canny_high=200 + a 3px dilate gave a clean single-loop
    # rim, disc circularity ~0.78-0.87, correctly rejecting a nearby
    # diagonal wall-corner edge at circularity ~0.01-0.11).
    cup_holder_canny_low: 80
    cup_holder_canny_high: 200
    cup_holder_blur_kernel_px: 5
    cup_holder_dilate_kernel_px: 3
    cup_holder_min_circularity: 0.6
    cup_holder_min_area_px: 400.0

    # Pass 2 — holes. THRESH_BINARY_INV, applied only within a square ROI
    # around the found cup_holder: grayscale pixels <= hole_thresh are
    # considered part of a hole cavity. The reference image shows the 4
    # holes as noticeably darker/reddish relative to the white disc
    # surface — 90 is a starting guess. hole_min_radius_px/
    # hole_max_radius_px are the floor/ceiling used to separate the 4 real
    # holes from small decorative screw-holes also visible near the disc's
    # rim in the reference image — verify actual pixel radii live before
    # trusting these.
    hole_thresh: 90
    hole_min_circularity: 0.6
    hole_min_radius_px: 4.0
    hole_max_radius_px: 40.0
