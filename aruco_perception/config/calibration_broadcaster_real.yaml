# Real: unlike sim (wrist-mounted camera, marker is fixed relative to the
# camera), the D415 is wall/ceiling-mounted — fixed relative to base_link,
# NOT to the arm. The arm instead carries the marker (mounted at/near
# robotiq_85_base_link, see real_ur3e_moveit_config/config/name.srdf and
# trajectory_planner_real.yaml's end_effector_frame — same frame, chosen
# 2026-07-17 over aruco_link, which was found to be sourced from an
# unreliable ad-hoc process, not a real fixed joint). So here
# base_link -> robotiq_85_base_link is the "known chain" (from joint
# states), and we're solving for base_link -> camera — the mounting is
# inverted from sim, but CalibrationBroadcasterNode's own logic doesn't
# care which physical thing moves; only these two frame names change.
calibration_broadcaster_node:
  ros__parameters:
    marker_pose_topic: "/aruco_perception/marker_pose"
    known_chain_frame: "base_link"
    marker_frame: "robotiq_85_base_link"
    # Appended to the detector's camera frame_id to form the broadcast TF's
    # child_frame_id, e.g. "camera_depth_optical_frame" becomes
    # "camera_depth_optical_frame_calibrated" — required so our computed
    # result never collides with any frame name the real camera driver
    # might independently publish under the same base name.
    broadcast_frame_suffix: "_calibrated"
    # PLACEHOLDER — not re-tuned for the real cell yet. Same default as
    # sim; lower this first if a real calibration run is timing out or
    # spending too long per attempt before the other real-specific knobs
    # below are suspected.
    num_samples: 10
    # This node orchestrates trajectory_planner directly (fetches waypoints
    # via ~/get_polygon_waypoints, moves one at a time via ~/trace_path,
    # waits for a fresh marker_pose after each settled move) rather than
    # passively collecting on a timer — see calibration_broadcaster_node.hpp.
    # How long to wait for a fresh marker_pose after each move before
    # aborting that sample (and the whole run) — e.g. marker out of view.
    # Lowered 8.0 -> 2.5 (2026-07-29), then raised 2.5 -> 5.0 (2026-07-29,
    # same day) after 2.5s caused a real failure live: aruco_detector_node
    # shows a normal ~1-2s detect/"not detected" flicker cycle THROUGHOUT
    # an entire run, even at waypoints where the marker was genuinely
    # visible and other samples at the same pose succeeded — confirmed via
    # trajcal_real_term_aruco_detector.log showing this alternation
    # continuously, not just near the failure. samples_per_waypoint's 2nd
    # sample at a waypoint can land during one of these ordinary
    # "currently in the not-detected phase of the flicker" gaps, so the
    # timeout needs real margin against that cycle, not just against
    # settle-to-first-detection latency (which IS well under 1s, per the
    # original 2.5s change's measurement — that measurement just didn't
    # account for a 2nd sample's wait potentially starting mid-flicker).
    # 5.0s comfortably covers at least 2 full flicker cycles. This does NOT
    # affect calibration accuracy/spread (it's a failure-detection timeout,
    # not an averaging parameter) — only how fast a GENUINELY stuck sample
    # (marker actually out of view, not just mid-flicker) gets reported.
    sample_wait_timeout_sec: 5.0
    # Planning strategy requested on every ~/trace_path call this node
    # makes — "cartesian" (straight-line, can fail partway near
    # limits/obstacles) or "joint_space" (free-space, more robust, no
    # straight-line guarantee). Was "joint_space" (real's reachable/
    # collision envelope around cal_ready wasn't as well-characterized as
    # sim's) — switched to "cartesian" 2026-07-20 to match sim's
    # already-confirmed-working setting, now that the actual root cause of
    # real-robot Cartesian-move failures near cal_ready was found and fixed
    # (multiple valid IK solutions for the same cal_ready Cartesian target
    # — see preset_poses_real.yaml's cal_ready_alt entry and
    # PresetPoses.hpp's doc comment). If polygon-corner moves still fail
    # partway (computeCartesianPath() stopping short) after switching cal_ready
    # to a verified joint-value preset, revert this to "joint_space". See
    # TracePath.srv.
    planning_mode: "cartesian"
    # Orientation-averaging method priority (0 = disabled, lower positive
    # number = tried first). Markley's method isn't implemented yet — leave
    # its priority at 0 until orientation_averaging.hpp adds it.
    orientation_sum_normalize_priority: 1
    orientation_markley_priority: 0

    # --- Random phase (2026-07-22 redesign) ---
    # After the polygon phase (num_samples above, 2 full passes around the
    # 4-corner polygon) completes, this many MORE samples are collected at
    # randomized X/Y/Z offsets from the same center pose — see
    # calibration_broadcaster_node.hpp's class doc comment and
    # CalibrationBroadcasterNode::runRandomPhase.
    # Raised 8 -> 10 (2026-07-29, live-validated on real) — set via
    # ros2 param set during testing, now persisted here so it survives a
    # node restart.
    random_phase_samples: 10
    # Maximum straight-line distance (m) a random candidate may be from
    # the center pose — checked before moving there. Tightened 0.10 -> 0.06
    # (2026-07-29, live-validated on real) — same reasoning as above.
    random_phase_max_offset_m: 0.06
    # Safety bound: how many consecutive invisible-marker random
    # candidates are tolerated before giving up on the whole calibration
    # run. Not expected to be hit in normal operation.
    random_phase_max_consecutive_failures: 20

    # --- Early-stop (2026-07-22 redesign) ---
    # A sample counts as "in agreement" with the running average if its
    # position is within this many cm AND its orientation is within
    # orientation_spread_tolerance_deg of the running average (see
    # CalibrationBroadcasterNode::stableAgreementReached). PLACEHOLDER —
    # not yet tuned against real calibration accuracy; increase both
    # tolerances (or stable_agreement_count below) if early-stop triggers
    # on noisy-but-not-actually-converged samples.
    position_spread_tolerance_cm: 2.0
    orientation_spread_tolerance_deg: 5.0
    # Number of samples (not necessarily consecutive) that must agree
    # within tolerance before calibration stops collecting early instead
    # of running the full polygon+random count. Push this higher if a
    # single lucky agreement is triggering early-stop too eagerly in a
    # noisy real environment.
    stable_agreement_count: 2

    # --- Orientation sweep phase (2026-07-29) ---
    # Runs once after polygon/random sampling is otherwise done (early-stop
    # or full count) — returns to cal_ready, then probes pitch down/up and
    # roll left/right, one extra sample each, before finishCalibration. See
    # CalibrationBroadcasterNode::runOrientationSweepPhase. Was enabled on
    # real — motivated by a live run (2026-07-29) that finished with
    # 37.0deg max / 14.9deg mean orientation spread: neither the polygon
    # nor random phase varies orientation at all (randomPoseNear only
    # offsets X/Y/Z), so this was the only source of orientation-diverse
    # samples. Disabled (2026-07-30, explicit request) — turns off the
    # extra pitch/roll probing motion entirely; calibration now only does
    # the polygon + random (position-only) phases, same as sim.
    orientation_sweep_enabled: false
    # Pitch/roll offset (degrees) for all 4 sweep probes. PLACEHOLDER —
    # starting value, not yet tuned against real accuracy; a probe losing
    # marker visibility live is a sign this is too large for cal_ready's
    # actual field-of-view margin, tune down if so.
    orientation_sweep_angle_deg: 5.0

    # --- Outlier rejection (2026-07-29) ---
    # In finishCalibration, discards any collected sample whose position OR
    # orientation deviation from the (unfiltered) mean exceeds the
    # corresponding threshold below, before computing the final average —
    # see CalibrationBroadcasterNode::rejectOutliers. Threshold-based: a
    # clean run (every sample already within both thresholds) discards
    # nothing. PLACEHOLDER — reusing the same values as
    # position_spread_tolerance_cm/orientation_spread_tolerance_deg above
    # as a starting point; not yet independently tuned.
    outlier_rejection_enabled: true
    outlier_position_threshold_cm: 2.0
    outlier_orientation_threshold_deg: 5.0

    # --- Dual-sampling per waypoint (2026-07-29) ---
    # Number of samples taken at each polygon/random-phase waypoint (no
    # additional move between them) before advancing — mitigates a single
    # bad/missed detection being that waypoint's only data point. Samples
    # from the same waypoint are pooled with every other sample; no
    # separate same-waypoint agreement check — outlier_rejection above
    # sorts out any disagreement between them. Set to 1 to restore the
    # original one-sample-per-waypoint behavior.
    samples_per_waypoint: 2

    # --- Clustering-based position+orientation averaging (2026-07-29) ---
    # When true, finishCalibration() computes the final broadcast POSITION
    # AND ORIENTATION by bucketing samples (pairwise position distance <=
    # clustering_bucket_size_cm AND pairwise orientation distance <=
    # clustering_bucket_angle_deg BOTH required to count as "same cluster")
    # and averaging only the largest cluster's members, instead of the
    # plain arithmetic mean/quaternion average of every kept sample — see
    # CalibrationBroadcasterNode::computeClusteredPose's doc comment.
    # Motivated by a direct live observation: many in-progress sample
    # meshes (CalibratedCameraModel.tsx, web UI) visibly clustered/
    # overlapped near one location while a few outliers sat further away —
    # a plain mean lets those outliers drag the result off. Position-only
    # clustering (this param's original 2026-07-29 version) still left a
    # visible camera ROLL error uncorrected, since orientation was still
    # averaged over every kept sample regardless of which position cluster
    # it landed in — orientation is now part of the clustering criterion
    # too, not just position. Read LIVE via get_parameter() at the point of
    # use, NOT cached — flip this via the web UI's DevSpace drawer switch
    # (Mean vs Clustering) and it takes effect on the very next
    # ~/calibrate run, no node restart needed. Default false: preserves
    # today's exact behavior until explicitly tried.
    use_clustering_average: false
    # Position offset tolerance (cm) for treating two samples as the same
    # cluster. Independently tunable from position_spread_tolerance_cm/
    # outlier_position_threshold_cm above (same 2.0cm starting value, not a
    # shared parameter) — only used when use_clustering_average is true.
    clustering_bucket_size_cm: 2.0
    # Orientation angular tolerance (degrees) for treating two samples as
    # the same cluster — BOTH this AND clustering_bucket_size_cm must hold.
    # Same 5.0deg starting value as orientation_spread_tolerance_deg/
    # outlier_orientation_threshold_deg above, independently tunable.
    clustering_bucket_angle_deg: 5.0