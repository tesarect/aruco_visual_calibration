# Simulation topics (see CLAUDE.md's Key Topics section) and detection
# tuning. Sim lighting is controlled/consistent, so the adaptive-threshold
# defaults below are OpenCV's own defaults — expect to retune these for the
# real robot's inconsistent lighting (see aruco_detector_real.yaml, once
# real-robot testing begins).
aruco_detector_node:
  ros__parameters:
    image_topic: "/wrist_rgbd_depth_sensor/image_raw"
    camera_info_topic: "/wrist_rgbd_depth_sensor/camera_info"
    pose_topic: "/aruco_perception/marker_pose"

    # classical/hybrid switch: true = this node is the active marker-pose
    # publisher on startup (classical is the default detector). Flipped
    # live by calibration_orchestrator_node via set_parameters, never
    # requires a restart — see aruco_detector_node.hpp's class doc comment.
    active: true

    # Overlay — published every frame regardless of marker detection
    # (2026-07-23: plain camera frame when the marker isn't found, marker
    # box+axes drawn when it is — see aruco_detector_node.hpp's class doc
    # comment for why this changed from "only published on detection").
    #
    # SIM ONLY (2026-07-29): rerouted to an intermediate, unpublished-to-web
    # topic — cup_holder_detector_node subscribes here, draws cup_holder/
    # hole on top, and republishes the COMBINED image as the sole publisher
    # of /aruco_perception/overlay_image (the web app's actual topic — see
    # CameraFeed.tsx's OVERLAY_IMAGE_TOPIC). This makes sim match real's
    # existing "one node, one combined image, one publish" pattern
    # (yolo_marker_bridge_node.py already draws marker+cup_holder+hole
    # together before its own single publish there). real's
    # aruco_detector_real.yaml is UNCHANGED — real's classical detector
    # remains the sole/direct publisher of /aruco_perception/overlay_image,
    # since cup_holder_detector_node never runs on real. See
    # cup_holder_detector_node.hpp's class doc comment for the sim-side
    # subscribe+republish logic this topic feeds.
    publish_overlay_image: true
    overlay_image_topic: "/aruco_perception/overlay_image_marker_only"
    overlay_border_color_bgr: [0, 255, 255]

    # Same topic yolo_marker_bridge_node.py already publishes cup_holder/
    # hole Detection2DArray on — this node adds the ArUco marker's own
    # pixel centroid/bbox (class_name "aruco_marker") to the same stream.
    detections_2d_topic: "/aruco_perception/detections_2d"

    # Live-toggled by calibration_orchestrator_node (set_parameters, no
    # restart) for the duration of its image-based centering routine —
    # draws a crosshair at the image's pixel center in the overlay stream
    # while true. Default false: no crosshair outside of active centering.
    show_centering_crosshair: false

    # Known / Given
    marker_length_m: 0.045
    dictionary_name: "DICT_4X4_50"

    marker_id: 0
    adaptive_thresh_win_size_min: 3
    adaptive_thresh_win_size_max: 23
    adaptive_thresh_win_size_step: 10
    adaptive_thresh_constant: 7.0
    min_marker_perimeter_rate: 0.03
    corner_refinement_method: 1
    # OpenCV's own defaults (2026-08-03) — added for struct/param-
    # declaration consistency with aruco_detector_real.yaml; sim's
    # synthetic marker doesn't have real-world corner-detection noise to
    # tune against, so these aren't expected to need changing here.
    corner_refinement_win_size: 5
    corner_refinement_max_iterations: 30
    corner_refinement_min_accuracy: 0.1
    polygonal_approx_accuracy_rate: 0.03