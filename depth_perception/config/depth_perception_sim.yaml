# Simulation wrist-mounted RGBD sensor topics (see CLAUDE.md's Key Topics
# section). These names come from the sim's Gazebo camera plugin — if this
# node logs "waiting for frames" and never receives any, double-check these
# against a live `ros2 topic list` first (documentation in this project is
# known to drift from the actual running system).
depth_perception_node:
  ros__parameters:
    rgb_image_topic: "/wrist_rgbd_depth_sensor/image_raw"
    depth_image_topic: "/wrist_rgbd_depth_sensor/depth/image_raw"
    camera_info_topic: "/wrist_rgbd_depth_sensor/camera_info"

    # Published by yolo_marker_bridge_node (aruco_perception_yolo_bridge) —
    # carries per-frame cup_holder/hole (and aruco_marker) 2D pixel
    # detections. Confirmed live on the real robot 2026-07 under this exact
    # name; sim uses the same topic name/message type, only the underlying
    # camera differs.
    detections_2d_topic: "/aruco_perception/detections_2d"

    # Gazebo's libgazebo_ros_camera plugin (confirmed in
    # intel_r430.urdf.xacro, the macro this sim's wrist_rgbd sensor is
    # built from) publishes 32FC1 depth already in meters, so no scaling
    # is needed — see DepthPerceptionConfig::depth_scale_to_meters's doc
    # comment for when this would need to change.
    depth_scale_to_meters: 1.0

    # 5x5 pixel patch (half-size 2) sampled around each detection's
    # centroid before taking the median depth.
    depth_patch_half_size_px: 2

    # Published by calibration_orchestrator_node — see
    # DepthPerceptionConfig::pause_while_calibration's doc comment.
    pause_while_calibration: true
    auto_calibrate_status_topic: "/calibration_orchestrator_node/auto_calibrate_status"

    # Rolling-window sample count per tracked instance (cup_holder, or
    # each hole_1..hole_4) before the oldest sample is dropped — see
    # RollingWindow's doc comment.
    rolling_window_size: 15

    # "Hold last known position" drift threshold (2026-07-27) — see
    # DepthPerceptionConfig::stable_drift_threshold_m's doc comment. A new
    # median must move more than this many meters from the held position
    # before it's accepted as a real change; holes/cup_holder are
    # physically fixed, so this filters both per-frame jitter AND gaps
    # where YOLO returns no detection at all that frame.
    stable_drift_threshold_m: 0.10

    # Continuous, gap-free "held position" stream for every tracked
    # instance ever seen — see StablePositionArray.msg's own doc comment.
    # Consumed by yolo_marker_bridge_node's overlay (drawing a stabilized
    # dot/label alongside its own raw per-frame boxes) and this node's own
    # broadcastInstanceTfs().
    stable_positions_topic: "/depth_perception/stable_positions"

    # --- cup_holder/hole TF broadcasting (2026-07-29) ---
    # Must match calibration_broadcaster_sim.yaml's own known_chain_frame.
    known_chain_frame: "base_link"
    # Must match calibration_broadcaster_sim.yaml's own
    # broadcast_frame_suffix — appended to this node's own incoming
    # detections_2d/depth header.frame_id to form the calibrated camera
    # frame to look up (e.g. "wrist_rgbd_camera_depth_optical_frame"
    # becomes "..._calibrated").
    broadcast_frame_suffix: "_calibrated"
    # Broadcasts base_link -> cup_holder/hole_1..hole_4 as live TF frames,
    # chained through the calibrated camera TF — see
    # broadcastInstanceTfs()'s doc comment. No-op (throttled log only)
    # until a ~/calibrate run has completed at least once this session.
    broadcast_instance_tfs: true

    # [Change the comment as this lift up is used to compensate to 
    # place tf on surface of the holder]
    instance_tf_z_offset_m: 0.05

    # [Change the comment as this lift up is used to compensate to 
    # place tf on surface of the holder]
    instance_tf_max_horizontal_dist_m: 0.0