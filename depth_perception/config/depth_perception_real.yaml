# Confirmed 2026-07-27 against the recorded rosbag
# new_diagnostics/rosbags/cupholder_depth_bag_2 (`ros2 bag info` + a direct
# deserialize of one frame) — do not trust the topic list in progress.md/
# CLAUDE.md for this, they were wrong here (both said /D415/depth/image_raw,
# which this bag never recorded at all).
depth_perception_node:
  ros__parameters:
    rgb_image_topic: "/D415/color/image_raw"

    # aligned_depth_to_color, NOT plain /D415/depth/image_raw — the D415's
    # color and depth sensors sit at physically different positions on the
    # camera, so an unaligned depth image would give a wrong 3D point for
    # a pixel coordinate that came from YOLO running on the COLOR image.
    # This topic is pre-registered to the color image's exact resolution
    # (424x240, confirmed matching camera_info) and pixel grid, which is
    # required for detection.cx/cy to index directly into it.
    depth_image_topic: "/D415/aligned_depth_to_color/image_raw"
    camera_info_topic: "/D415/color/camera_info"

    # Confirmed live: yolo_marker_bridge_node publishing real cup_holder
    # (94-95% confidence) and hole (82-98% confidence) detections here.
    detections_2d_topic: "/aruco_perception/detections_2d"

    # Confirmed via direct rosbag inspection: this topic's encoding is
    # 16UC1 (integer millimeters), NOT 32FC1 meters like sim's Gazebo
    # plugin — a sampled real frame had a median raw value of 890, i.e.
    # 0.89m, a plausible distance for a wall-mounted camera looking at a
    # countertop. Do NOT copy sim's 1.0 here.
    depth_scale_to_meters: 0.001

    depth_patch_half_size_px: 2

    # --- radius-scaled depth-sampling patch (2026-08-03) ---
    # Same mechanism as sim (see depth_perception_sim.yaml's own comment,
    # and DepthPerceptionConfig's own doc comment in
    # depth_perception_node.hpp) — this code path is identical for both
    # environments, only the depth topic/encoding differs, so it's
    # plausible real's holes have the same fixed-patch rim bias, but this
    # has NOT been visually/numerically confirmed on real yet (only sim
    # has been observed so far). Defaulted here to the same no-op as sim
    # (clamps to depth_patch_half_size_px regardless of actual radius) —
    # capture backProjectDetection's new diagnostic log line from a real
    # run FIRST, then tune radius_scale_factor down only if real's log
    # actually shows the same symptom sim did.
    depth_patch_radius_scale_factor: 1.0
    depth_patch_min_half_size_px: 1

    # Published by calibration_orchestrator_node — see
    # DepthPerceptionConfig::pause_while_calibration's doc comment.
    pause_while_calibration: true
    auto_calibrate_status_topic: "/calibration_orchestrator_node/auto_calibrate_status"

    # Rolling-window sample count per tracked instance (cup_holder, or
    # each hole_1..hole_4) before the oldest sample is dropped — see
    # RollingWindow's doc comment.
    rolling_window_size: 15

    # "Hold last known position" drift threshold (2026-07-27) — see
    # DepthPerceptionConfig::stable_drift_threshold_m's doc comment. A new
    # median must move more than this many meters from the held position
    # before it's accepted as a real change; holes/cup_holder are
    # physically fixed, so this filters both per-frame jitter AND gaps
    # where YOLO returns no detection at all that frame — confirmed live
    # this session as the actual cause of the reported "flickering"
    # (rolling_window_size alone, even set absurdly high, did not help,
    # since a bigger window has nothing to average when no sample arrives
    # at all).
    stable_drift_threshold_m: 0.10

    # Continuous, gap-free "held position" stream for every tracked
    # instance ever seen — see StablePositionArray.msg's own doc comment.
    # Consumed by yolo_marker_bridge_node's overlay (drawing a stabilized
    # dot/label alongside its own raw per-frame boxes) and this node's own
    # broadcastInstanceTfs().
    stable_positions_topic: "/depth_perception/stable_positions"

    # --- cup_holder/hole TF broadcasting (2026-07-29) ---
    # Must match calibration_broadcaster_real.yaml's own known_chain_frame.
    known_chain_frame: "base_link"
    # Must match calibration_broadcaster_real.yaml's own
    # broadcast_frame_suffix — appended to this node's own incoming
    # detections_2d/depth header.frame_id (e.g. "D415_color_optical_frame")
    # to form the calibrated camera frame to look up (confirmed live
    # 2026-07-29: real actually broadcasts
    # "D415_color_optical_frame_calibrated", NOT
    # "camera_depth_optical_frame_calibrated" as an earlier web-app
    # constant incorrectly assumed — see markerFrames.ts's own fix comment).
    broadcast_frame_suffix: "_calibrated"
    # Broadcasts base_link -> cup_holder/hole_1..hole_4 as live TF frames,
    # chained through the calibrated camera TF — see
    # broadcastInstanceTfs()'s doc comment. No-op (throttled log only)
    # until a ~/calibrate run has completed at least once this session.
    broadcast_instance_tfs: true

    # Added straight to cup_holder's broadcast translation.z (2026-07-30,
    # real-only — no entry in depth_perception_sim.yaml). Read LIVE every
    # broadcastInstanceTfs() call, tunable via
    # `ros2 param set /depth_perception_node instance_tf_z_offset_m <value>`
    # with NO node restart needed. hole_1..hole_4 inherit this
    # automatically (parented to cup_holder, not base_link, directly).
    # DOES NOT reduce cup_holder's actual distance from base_link, only
    # the reported/broadcast Z — measured live 2026-07-30, cup_holder's
    # HORIZONTAL (X/Y) distance from base_link alone is already ~0.64m,
    # past the UR3e's ~0.5m datasheet max_reach_m (see
    # trajectory_planner_real.yaml's own max_reach_m), so no amount of
    # Z-only offset makes the position actually reachable — this is a
    # fast, explicitly-requested, fully reversible thing to try (set back
    # to 0.0 to undo), not a fix for the underlying reach limitation.
    # Turned OFF (2026-07-30) — this masks bad TF placement rather than
    # fixing it; leave at 0.0 while working through the accuracy
    # investigation in _errors/finetuning_modification_floor_plan.txt.
    # Re-enable only if reachability (not accuracy) becomes the immediate
    # blocker again.
    instance_tf_z_offset_m: 0.0

    # Camera pitch-down correction for cup_holder only (2026-08-06,
    # real-only — no entry in depth_perception_sim.yaml). Compensates a
    # suspected camera pitch error by rotating cup_holder's camera-frame
    # point downward (about the camera optical frame's X axis) by this many
    # degrees, then rescaling the point back out along the new ray so its
    # depth (Z) matches the original, unrotated depth — i.e. the corrected
    # point still lies on the same physical plane the sensor actually
    # measured, instead of sinking into the holder toward the camera. See
    # broadcastInstanceTfs()'s own doc comment for the exact math.
    # Live-read every call, tunable via
    # `ros2 param set /depth_perception_node instance_tf_pitch_down_deg <value>`
    # with NO node restart needed. 0.0 disables this entirely.
    instance_tf_pitch_down_deg: 17.0

    # Hole diagonal-swap correction (2026-08-06, real-only — no entry in
    # depth_perception_sim.yaml). Confirmed live: hole_1<->hole_4 and
    # hole_2<->hole_3 swap positions in base_link — a 180-degree rotation
    # about the camera's own optical Z axis, from known_to_camera's
    # calibrated orientation landing near a half-turn (confirmed LOW
    # CONFIDENCE calibration runs, 17-20deg spread). hole_number itself is
    # assigned correctly upstream from 2D image quadrants — NOT a labeling
    # bug. true negates the camera-frame X/Y offset (Z untouched) before
    # rotating into base_link, exactly undoing the swap. See
    # broadcastInstanceTfs()'s own doc comment for the exact math.
    # Live-read every call, tunable via
    # `ros2 param set /depth_perception_node instance_tf_hole_yaw_flip <true|false>`
    # with NO node restart needed.
    instance_tf_hole_yaw_flip: true

    # Forces every hole's Z offset from cup_holder to 0.0 (2026-08-06,
    # real-only — no entry in depth_perception_sim.yaml), so all 4 holes
    # broadcast on the EXACT SAME Z plane as cup_holder itself (physically
    # correct — the holder rim and its 4 holes are one rigid, flat-topped
    # object) instead of each hole keeping its own small, independently-
    # noisy Z offset. Live-read every call, tunable via
    # `ros2 param set /depth_perception_node instance_tf_holes_flush_with_holder <true|false>`
    # with NO node restart needed.
    instance_tf_holes_flush_with_holder: true

    # Horizontal (X/Y) reachability clamp (2026-07-30, real-only — no
    # entry in depth_perception_sim.yaml) — same "explicitly requested
    # cheat, not a real fix" spirit as instance_tf_z_offset_m above, same
    # live-tunable convention:
    # `ros2 param set /depth_perception_node instance_tf_max_horizontal_dist_m <value>`
    # with NO node restart needed. If cup_holder's horizontal distance
    # from base_link exceeds this radius, its X/Y is scaled back toward
    # base_link's origin (same direction, i.e. pulled straight toward the
    # arm) until it sits exactly at this radius — Z is untouched (handled
    # separately by instance_tf_z_offset_m above). 0.0 disables the clamp
    # (today's raw, unclamped position). 0.45 is a starting value: under
    # the UR3e's ~0.5m datasheet max_reach_m (trajectory_planner_real.yaml's
    # own max_reach_m) with a small margin, since actual reachable envelope
    # is typically somewhat less than the pure datasheet number once
    # orientation/joint-limit constraints are factored in. DOES NOT make
    # the real physical holder/table any closer — only changes the
    # reported position the arm is told to reach.
    # Turned OFF (2026-07-30) — same reasoning as instance_tf_z_offset_m
    # above; 0.0 disables the clamp entirely.
    instance_tf_max_horizontal_dist_m: 0.0

    # X/Y fine-tune offset for cup_holder only (2026-08-03) — see
    # DepthPerceptionConfig::instance_tf_xy_offset_m's own doc comment (in
    # depth_perception_node.hpp) for the full rationale. Diagnosed so far
    # ONLY on sim: sim's cup_holder centroid comes from cv::fitEllipse on a
    # classical-CV rim contour, a fundamentally different detector from
    # real's YOLO-based cx,cy (bbox-center, no fitEllipse step at all) — so
    # this specific bias is NOT confirmed to apply to real's cup_holder at
    # all. Left at [0.0, 0.0] (no-op) until a real-side measurement/
    # screenshot actually shows a comparable offset — do not assume real
    # needs this just because sim did. Same live-tunable convention as sim
    # if it ever turns out to be needed here:
    # `ros2 param set /depth_perception_node instance_tf_xy_offset_m [x, y]`.
    instance_tf_xy_offset_m: [0.0, 0.0]

    # --- Depth-view overlay (2026-08-04) ---
    # Separate overlay stream from yolo_marker_bridge_node's own
    # /aruco_perception/overlay_image (color-image base) — this one uses
    # the colorized DEPTH image as its base, with the same detection
    # centroids + the actual sampled patch drawn on top. Added so the
    # web app's camera view can directly show "what the depth camera sees"
    # for the hole/cup_holder placement investigation — see
    # DepthPerceptionConfig::publish_depth_overlay_image's own doc comment.
    publish_depth_overlay_image: true
    depth_overlay_image_topic: "/depth_perception/overlay_image"
